<div class="tab-shell">
  <app-ai-tab-status
    [hasImage]="session.hasImage()"
    [isAnalyzing]="session.isGenerating()"
    [error]="session.generationError()"
    [analyzingLabel]="session.progressText()"
    [retryNote]="wallet.costNote()"
    (retry)="generate()"
  />

  @if (results(); as r) {
    @for (section of sections; track section.title) {
      <app-ui-card>
        <app-ui-section [title]="section.title" [icon]="section.icon" [description]="section.description">
          <div class="tab-shell__grid">
            @for (field of section.fields; track field.key) {
              <app-editable-field
                [class.tab-shell__grid-item--full]="field.multiline"
                [label]="field.label"
                [maxLength]="field.maxLength"
                [multiline]="!!field.multiline"
                [value]="r[field.key]?.values?.[0] ?? ''"
                [suggestions]="r[field.key]?.values ?? []"
                [confidence]="r[field.key]?.confidence ?? null"
                [reason]="r[field.key]?.reason ?? null"
                (valueChange)="session.updateField('instagram', field.key, $event)"
                [improveLeft]="session.fixAssists()?.left ?? null"
                [improveLimit]="session.isAiBlocked(field.key, field.label) ? 'blocked' : session.fixLimit()"
                [improving]="session.improvingField() === 'instagram:' + field.key"
                (improve)="session.improveField('instagram', field.key, field.label, field.maxLength)"
              />
            }
          </div>
        </app-ui-section>
      </app-ui-card>
    }
  }
</div>
