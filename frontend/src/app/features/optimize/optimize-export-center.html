<div class="tab-shell">
  <app-ai-tab-status [hasImage]="session.hasImage()" />

  @if (session.hasImage()) {
    <app-ui-card [elevated]="true">
      <app-ui-section title="Export Center" icon="ios_share" description="Download each marketplace listing as an Excel file, ready for bulk upload.">
        <div class="tab-shell__grid tab-shell__grid--single">
          @for (entry of marketplaces; track entry.tab) {
            <div class="tab-shell__row">
              <span class="tab-shell__row-label">
                <app-marketplace-icon [marketplace]="entry.marketplace" [size]="20" />
                {{ entry.label }}
              </span>
              <button mat-stroked-button [disabled]="!hasResult(entry.tab)" (click)="exportExcel(entry)">
                <mat-icon>download</mat-icon>
                {{ hasResult(entry.tab) ? 'Export Excel' : 'Not generated yet' }}
              </button>
            </div>
          }
        </div>
      </app-ui-section>
    </app-ui-card>
  }
</div>
