<h2 mat-dialog-title>Log Sale — {{ listing.name }}</h2>

<mat-dialog-content class="form-dialog">
  <p class="stock-note">{{ availableStock }} unit{{ availableStock === 1 ? '' : 's' }} currently in stock.</p>

  <label class="field" for="sale-platform">
    <span class="field__label">Platform</span>
    <select id="sale-platform" class="field__input" [ngModel]="platform()" (ngModelChange)="platform.set($event)">
      @for (p of platforms; track p) {
        <option [value]="p">{{ p }}</option>
      }
    </select>
  </label>

  <div class="field-row">
    <label class="field" for="sale-qty">
      <span class="field__label">Quantity sold</span>
      <input id="sale-qty" class="field__input" type="number" min="1" step="1" inputmode="numeric" [max]="availableStock" [ngModel]="quantity()" (ngModelChange)="quantity.set($event)" />
    </label>
    <label class="field" for="sale-price">
      <span class="field__label">Sale price (per unit, ₹)</span>
      <input id="sale-price" class="field__input" type="number" min="0" inputmode="decimal" [ngModel]="salePrice()" (ngModelChange)="salePrice.set($event)" />
    </label>
  </div>

  @if (errorMessage()) {
    <p class="error-note" role="alert">{{ errorMessage() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">
    <mat-icon aria-hidden="true">point_of_sale</mat-icon>
    Log Sale
  </button>
</mat-dialog-actions>
