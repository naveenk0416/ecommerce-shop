<h2 mat-dialog-title>{{ isEditing ? 'Edit Product' : 'Add Product' }}</h2>

<mat-dialog-content class="form-dialog">
  @if (canOpenFullListing) {
    <button type="button" mat-stroked-button class="open-full" (click)="openFullListing()">
      <mat-icon aria-hidden="true">article</mat-icon>
      Open full listing (all marketplace content)
    </button>
  }

  <label class="field" for="pf-name">
    <span class="field__label">Product name *</span>
    <input id="pf-name" class="field__input" [ngModel]="name()" (ngModelChange)="name.set($event)" placeholder="e.g. Layered Coin Charm Necklace" [attr.aria-invalid]="!!errors()['name']" />
  </label>

  <div class="field-row">
    <label class="field" for="pf-category">
      <span class="field__label">Category</span>
      <input id="pf-category" class="field__input" [ngModel]="category()" (ngModelChange)="category.set($event)" placeholder="e.g. Jewellery" />
    </label>
    <label class="field" for="pf-quantity">
      <span class="field__label">Stock (units) *</span>
      @if (hasSizes()) {
        <input id="pf-quantity" class="field__input" type="number" [value]="sizeTotal()" readonly title="Total of all sizes — edit stock per size below" />
      } @else {
        <input id="pf-quantity" class="field__input" type="number" min="0" step="1" inputmode="numeric" [ngModel]="quantity()" (ngModelChange)="quantity.set($event)" [attr.aria-invalid]="!!errors()['quantity']" />
      }
      @if (errors()['quantity']) { <span class="field__error">{{ errors()['quantity'] }}</span> }
    </label>
  </div>

  <div class="field-row">
    <label class="field" for="pf-cost">
      <span class="field__label">Cost price (₹)</span>
      <input id="pf-cost" class="field__input" type="number" min="0" inputmode="decimal" [ngModel]="costPrice()" (ngModelChange)="costPrice.set($event)" [attr.aria-invalid]="!!errors()['costPrice']" />
      @if (errors()['costPrice']) { <span class="field__error">{{ errors()['costPrice'] }}</span> }
    </label>
    <label class="field" for="pf-selling">
      <span class="field__label">Selling price (₹) *</span>
      <input id="pf-selling" class="field__input" type="number" min="0" inputmode="decimal" [ngModel]="sellingPrice()" (ngModelChange)="sellingPrice.set($event)" [attr.aria-invalid]="!!errors()['sellingPrice']" />
      @if (errors()['sellingPrice'] && sellingPrice() !== null) { <span class="field__error">{{ errors()['sellingPrice'] }}</span> }
    </label>
  </div>

  <div class="field-row">
    <label class="field" for="pf-mrp">
      <span class="field__label">Maximum Retail Price (MRP, ₹)</span>
      <input id="pf-mrp" class="field__input" type="number" min="0" inputmode="decimal" [ngModel]="mrp()" (ngModelChange)="mrp.set($event)" placeholder="Defaults to selling price" [attr.aria-invalid]="!!errors()['mrp']" />
      @if (errors()['mrp']) { <span class="field__error">{{ errors()['mrp'] }}</span> }
    </label>
    <label class="field" for="pf-threshold">
      <span class="field__label">Low-stock alert at (units)</span>
      <input id="pf-threshold" class="field__input" type="number" min="0" step="1" inputmode="numeric" [ngModel]="lowStockThreshold()" (ngModelChange)="lowStockThreshold.set($event)" [placeholder]="defaultThreshold + ' (default)'" [attr.aria-invalid]="!!errors()['lowStockThreshold']" />
      @if (errors()['lowStockThreshold']) { <span class="field__error">{{ errors()['lowStockThreshold'] }}</span> }
    </label>
  </div>

  <div class="field-row">
    <label class="field" for="pf-hsn">
      <span class="field__label">HSN code</span>
      <input id="pf-hsn" class="field__input" [ngModel]="hsnCode()" (ngModelChange)="hsnCode.set($event)" placeholder="e.g. 7117" aria-describedby="pf-gst" />
    </label>
    <div class="field">
      <span class="field__label">GST rate (calculated)</span>
      <span id="pf-gst" class="gst-readout" [class.gst-readout--review]="!gst() || gst()!.needsReview" aria-live="polite">
        @if (gst(); as g) {
          <strong>{{ g.rate !== null ? g.rate + '%' : 'Needs review' }}</strong>
          <span>{{ g.reason }}</span>
        } @else {
          <span>Enter the HSN code — GST is calculated from HSN + selling price (GST 2.0).</span>
        }
      </span>
    </div>
  </div>

  <label class="field" for="pf-description">
    <span class="field__label">Description</span>
    <textarea id="pf-description" class="field__input field__input--textarea" rows="3" [ngModel]="description()" (ngModelChange)="description.set($event)" placeholder="Optional notes about this product…"></textarea>
  </label>

  <div class="sizes-box">
    <app-variant-editor [(variants)]="variants" [(preset)]="sizePreset" [category]="category()" [title]="name()" [showSkus]="true" [lockSizes]="sizesLocked" [showSizeChart]="false" />
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!isValid()" (click)="submit()">
    <mat-icon aria-hidden="true">{{ isEditing ? 'save' : 'add' }}</mat-icon>
    {{ isEditing ? 'Save Changes' : 'Add Product' }}
  </button>
</mat-dialog-actions>
