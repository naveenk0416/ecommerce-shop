<div class="min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors">
  <app-marketplace-header
    [productName]="workspaceState.product()?.basicInformation?.productName ?? ''"
    [sku]="workspaceState.product()?.basicInformation?.sku ?? ''" />

  <div class="max-w-7xl mx-auto px-6 py-10">
    @if (workspaceState.loading()) {
      <div class="space-y-4 animate-pulse">
        <div class="h-8 w-64 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
        <div class="h-40 w-full bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
        <div class="h-40 w-full bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
      </div>
    } @else if (workspaceState.error()) {
      <div class="p-8 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-3xl text-red-600 dark:text-red-400 font-bold text-sm">
        {{ workspaceState.error() }}
      </div>
    } @else {
      <router-outlet />
    }
  </div>
</div>
