<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Amazon Listing" icon="shopping_bag" description="Title, bullets, and search terms for the Amazon catalog.">
      <app-editable-field label="Listing Title" placeholder="Amazon-optimized product title" />
      <app-editable-field label="Bullet Points" placeholder="Key selling points, one per line..." [multiline]="true" />
      <app-editable-field label="Backend Search Keywords" placeholder="comma, separated, keywords" />
    </app-ui-section>
  </app-ui-card>

  <app-ui-card>
    <app-ui-section title="Amazon Category" icon="category" description="Browse node this listing will map to.">
      <app-editable-field label="Category Path" placeholder="e.g. Home & Kitchen > Storage" />
    </app-ui-section>
  </app-ui-card>
</div>
