<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Flipkart Listing" icon="storefront" description="Title and key features for the Flipkart catalog.">
      <app-editable-field label="Listing Title" placeholder="Flipkart-optimized product title" />
      <app-editable-field label="Key Features" placeholder="Key features, one per line..." [multiline]="true" />
    </app-ui-section>
  </app-ui-card>

  <app-ui-card>
    <app-ui-section title="Flipkart Category" icon="category" description="Category tree this listing maps to.">
      <app-editable-field label="Category Path" placeholder="e.g. Accessories > Hair Accessories" />
    </app-ui-section>
  </app-ui-card>
</div>
