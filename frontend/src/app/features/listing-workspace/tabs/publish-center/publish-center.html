<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Publish Center" icon="publish" description="Publish actions are placeholders — no publishing logic is wired up yet.">
      <div class="tab-shell__checklist">
        @for (row of rows; track row.marketplace) {
          <div class="tab-shell__row">
            <span class="tab-shell__row-label">
              <app-marketplace-icon [marketplace]="row.marketplace" [size]="18" />
              {{ row.label }}
            </span>
            <button mat-stroked-button color="primary" disabled>Publish</button>
          </div>
        }
      </div>
    </app-ui-section>
  </app-ui-card>
</div>
