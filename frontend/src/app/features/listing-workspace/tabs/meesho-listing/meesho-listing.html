<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Meesho Listing" icon="diversity_3" description="Title and description tuned for the Meesho audience.">
      <app-editable-field label="Listing Title" placeholder="Meesho-optimized product title" />
      <app-editable-field label="Product Description" placeholder="Simple, value-focused description..." [multiline]="true" />
    </app-ui-section>
  </app-ui-card>

  <app-ui-card>
    <app-ui-section title="Meesho Category" icon="category" description="Category tree this listing maps to.">
      <app-editable-field label="Category Path" placeholder="e.g. Women > Hair Accessories" />
    </app-ui-section>
  </app-ui-card>
</div>
