<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Marketplace Readiness" icon="fact_check" description="Checklist placeholder — no validation logic is wired up yet.">
      <div class="tab-shell__checklist">
        @for (row of rows; track row.marketplace) {
          <div class="tab-shell__row">
            <span class="tab-shell__row-label">
              <app-marketplace-icon [marketplace]="row.marketplace" [size]="18" />
              {{ row.label }}
            </span>
            <span class="tab-shell__badge">Not checked</span>
          </div>
        }
      </div>
    </app-ui-section>
  </app-ui-card>
</div>
