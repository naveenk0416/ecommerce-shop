<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Export Center" icon="ios_share" description="Export actions are placeholders — no export logic is wired up yet.">
      <div class="tab-shell__grid tab-shell__grid--single">
        @for (format of formats; track format.id) {
          <div class="tab-shell__row">
            <span class="tab-shell__row-label">
              <mat-icon>{{ format.icon }}</mat-icon>
              {{ format.label }}
            </span>
            <button mat-stroked-button disabled>
              <mat-icon>download</mat-icon>
              Export
            </button>
          </div>
        }
      </div>
    </app-ui-section>
  </app-ui-card>
</div>
