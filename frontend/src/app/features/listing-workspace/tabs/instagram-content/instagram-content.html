<div class="tab-shell">
  <app-ui-card [elevated]="true">
    <app-ui-section title="Instagram Content" icon="photo_camera" description="Caption and tags for your Instagram post.">
      <app-editable-field label="Caption" placeholder="Write an engaging caption..." [multiline]="true" />
      <app-editable-field label="Hashtags" placeholder="#handmade #ecommerce #trending" />
    </app-ui-section>
  </app-ui-card>

  <app-ui-card>
    <app-ui-section title="Post Preview" icon="image" description="Placeholder preview of the media that will be posted.">
      <div class="tab-shell__preview">No media selected</div>
    </app-ui-section>
  </app-ui-card>
</div>
